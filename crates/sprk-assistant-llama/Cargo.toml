[package]
name = "sprk-assistant-llama"
description = "The llama.cpp adapter and helper binary for the assistant (ADR-009). Built on its own: it compiles C++"
version = "0.0.1"
edition = "2021"
license = "MIT"

[[bin]]
name = "sprk-assistant"
path = "src/main.rs"

[dependencies]
sprk-assistant = { path = "../sprk-assistant" }
sprk-models = { path = "../sprk-models" }
# Pinned: the wrapper's API moves between releases. CPU only; no OpenMP (ggml uses its own threads).
llama-cpp-2 = { version = "=0.1.161", default-features = false }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

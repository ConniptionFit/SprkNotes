[package]
name = "sprk-assistant"
description = "On-device assistant core: engine trait, grounded prompts, titles, resource governor (ADR-009)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sprk-config = { path = "../sprk-config" }

[features]
# A scripted engine inside the helper binary, for tests only. Never enabled in shipped builds.
fake-engine = []

[[bin]]
name = "sprk-assistant-stub"
path = "src/bin/sprk-assistant-stub.rs"

[lints]
workspace = true

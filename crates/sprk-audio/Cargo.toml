[package]
name = "sprk-audio"
description = "Audio capture and echo cancellation behind the platform seam"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# cpal capture backend: WASAPI mic + loopback on Windows, ALSA/PipeWire on Linux, AAudio/OpenSL
# (through oboe) mic only on Android. Off by default.
cpal-backend = ["dep:cpal", "dep:ringbuf"]

[dependencies]
thiserror.workspace = true
sonora = { version = "0.3", default-features = false }
cpal = { version = "0.15", optional = true }
ringbuf = { version = "0.4", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Devices_FunctionDiscovery", "Win32_Media_Audio",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem",
] }

[lints]
workspace = true

name: Android
# Debug build of the phone app (ADR-015) plus an unsigned release build to measure the install
# size: arm64 only. It proves the shared crates and the app build for Android on every change. Nothing is uploaded,
# except when a maintainer runs it by hand with "test_apk" on: then the debug APK is kept as a 7-day download on that
# run's page. The repository is public, so anyone signed in to GitHub can download it. Never a signed release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_apk:
        description: Keep the debug APK as a 7-day download on this run (public repository)
        type: boolean
        default: false
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  debug-apk:
    name: debug APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rust toolchain
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal -t aarch64-linux-android
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri
            app/src-tauri/target
            ~/.cache/sprknotes/sherpa
          key: android-${{ hashFiles('app/src-tauri/Cargo.lock', 'Cargo.lock') }}
      # The cargo-installed CLI, not the npm one: Gradle calls the CLI back from app/src-tauri,
      # where there is no package.json, and `cargo tauri` works from any folder.
      - name: Tauri CLI
        run: command -v cargo-tauri || cargo install tauri-cli --version '^2' --locked
      # The speech engine (ADR-015 Decision 3): only the two arm64 libraries the phone needs, so
      # the build copies just those into jniLibs instead of the whole sherpa-onnx Android archive.
      - name: Speech engine libraries
        run: |
          bash scripts/fetch-sherpa.sh android-arm64
          echo "SHERPA_ONNX_LIB_DIR=$(bash scripts/fetch-sherpa.sh --print android-arm64)" >> "$GITHUB_ENV"
      - name: UI dependencies
        working-directory: app/ui
        run: npm ci
      - name: Build the debug APK
        working-directory: app
        run: cargo tauri android build --debug --apk --target aarch64 --ci
      - name: Keep the debug APK for testing (7 days, only when asked)
        if: github.event_name == 'workflow_dispatch' && inputs.test_apk
        uses: actions/upload-artifact@v4
        with:
          name: SprkNotes-debug-arm64-${{ github.sha }}
          path: app/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          retention-days: 7
          if-no-files-found: error
      # Size check only (ADR-015 Decision 3): an unsigned release build, never uploaded or published.
      - name: Release APK size (unsigned, arm64)
        working-directory: app
        run: |
          cargo tauri android build --apk --target aarch64 --ci
          find src-tauri/gen/android -name '*.apk' -exec ls -l {} \;
          find src-tauri/gen/android -name '*release*.apk' -exec unzip -l {} 'lib/*' \;

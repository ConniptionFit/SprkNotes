name: Publish assistant model
# Run from the Actions tab ("Run workflow"). Downloads an open-weights GGUF, builds a SprkNotes
# assistant pack from it, splits it into 80 MB parts, merges it into the models index and uploads
# everything to the "models" release (the app's Download model buttons read that index).
# Nothing is committed to git. See ADR-010. Runs one at a time, because each run rewrites the index.
on:
  workflow_dispatch:
    inputs:
      hf_repo:
        description: 'Hugging Face repository with the GGUF files'
        default: 'unsloth/Qwen3.5-2B-GGUF'
      quant:
        description: 'Quantization to pick from that repository'
        default: 'Q4_K_M'
      pack_id:
        default: 'qwen3-5-2b-q4'
      version:
        description: 'Pack version, YYYY.MM.patch'
        default: '2026.11.0'
      tier:
        type: choice
        default: 'light'
        options: [titles, light, standard]
      ram_mb:
        description: 'Estimated memory with the model loaded (MB)'
        default: '2200'
      display_name:
        default: 'Qwen3.5 2B (Q4)'
      dry_run:
        description: 'Build and merge the index but upload nothing'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: models-index
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sprkctl
        run: cargo build --release --locked -p sprkctl
      - name: Download the weights
        env:
          HF_REPO: ${{ inputs.hf_repo }}
          QUANT: ${{ inputs.quant }}
        run: |
          set -euo pipefail
          mkdir -p work
          curl -fsSL "https://huggingface.co/api/models/$HF_REPO" -o work/hf.json
          python3 -I - <<'PY'
          import json, os
          m = json.load(open("work/hf.json"))
          q = os.environ["QUANT"].lower()
          files = [s["rfilename"] for s in m["siblings"]
                   if s["rfilename"].lower().endswith(".gguf") and q in s["rfilename"].lower()
                   and "/" not in s["rfilename"] and "mmproj" not in s["rfilename"].lower()]
          if len(files) != 1:
              raise SystemExit(f"expected one {q} GGUF, found: {files}")
          lic = (m.get("cardData") or {}).get("license", "")
          if lic != "apache-2.0" and "license:apache-2.0" not in m.get("tags", []):
              raise SystemExit(f"license is {lic!r}, expected apache-2.0")
          sha = m.get("sha", "")
          if len(sha) != 40:
              raise SystemExit("no commit id for the repository")
          open("work/file.txt", "w").write(files[0])
          open("work/rev.txt", "w").write(sha)
          print("picked", files[0], "at", sha, "license", lic)
          PY
          f=$(cat work/file.txt); rev=$(cat work/rev.txt)
          # Pinned to the commit read above, so the pack is exactly what was checked.
          curl -fL --retry 4 -o work/weights.gguf "https://huggingface.co/$HF_REPO/resolve/$rev/$f"
          ls -l work/weights.gguf
          echo "$HF_REPO/$f@$rev" > work/source.txt
      - name: Build the pack folder
        env:
          ID: ${{ inputs.pack_id }}
          VERSION: ${{ inputs.version }}
          TIER: ${{ inputs.tier }}
          RAM: ${{ inputs.ram_mb }}
          NAME: ${{ inputs.display_name }}
        run: |
          python3 scripts/make-assistant-pack-folder.py work/weights.gguf work/folder \
            --id "$ID" --version "$VERSION" --tier "$TIER" --ram-mb "$RAM" --display-name "$NAME" \
            --prompt-format chatml-nothink --context 8192 --license Apache-2.0 \
            --source "huggingface.co/$(cat work/source.txt)" \
            --attribution "Qwen3.5 by the Qwen team, Alibaba Cloud. Licensed under the Apache License 2.0."
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SPRK_REPO: ${{ github.repository }}
          SPRKCTL: ${{ github.workspace }}/target/release/sprkctl
          DRY_IN: ${{ inputs.dry_run }}
        run: |
          [ "$DRY_IN" = true ] && export DRY_RUN=1
          scripts/publish-assistant-model.sh "$PWD/work/out" "$PWD/work/folder"
      - name: Show the index
        run: python3 -I -c "import json;[print(m['id'],m['version'],m.get('tier',''),m['size'],len(m.get('parts',[]))) for m in json.load(open('work/out/models-index.json'))['models']]"

name: CI
on: [push, pull_request]
# GitHub copy of .forgejo/workflows/ci.yml. Keep the two job lists in step (scripts/check-ci-parity.sh).
# Forgejo prefers .forgejo/workflows when both exist, so the same repository can run on either host.
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal -c clippy,rustfmt -t x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - run: . "$HOME/.cargo/env" && cargo fmt --all --check
      - run: . "$HOME/.cargo/env" && cargo clippy --workspace --all-targets -- -D warnings
      - run: . "$HOME/.cargo/env" && cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - run: . "$HOME/.cargo/env" && cargo clippy --workspace --all-targets --target aarch64-pc-windows-msvc -- -D warnings
      - run: . "$HOME/.cargo/env" && cargo test --workspace
      - run: . "$HOME/.cargo/env" && cargo test -p sprk-assistant --features fake-engine
      - run: scripts/check-terms.sh
      - run: scripts/check-ci-parity.sh
      - run: . "$HOME/.cargo/env" && scripts/check-assistant-deps.sh
      - run: . "$HOME/.cargo/env" && scripts/bump-version.sh --check
  # The llama.cpp helper compiles C++ (slow), so it is its own job and its own workspace.
  assistant-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: |
          if ! command -v cmake >/dev/null || ! command -v clang >/dev/null; then
            (sudo -n true 2>/dev/null && SUDO=sudo || SUDO=; $SUDO apt-get update -qq && $SUDO apt-get install -y -qq cmake clang libclang-dev python3-venv)
          fi
      - name: Rust toolchain
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal -c clippy,rustfmt
      - run: . "$HOME/.cargo/env" && scripts/test-assistant-engine.sh

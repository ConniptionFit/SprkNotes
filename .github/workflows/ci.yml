name: CI
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt", targets: "x86_64-pc-windows-msvc,aarch64-pc-windows-msvc" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: scripts/check-terms.sh
      - run: scripts/bump-version.sh --check
      - run: cargo install cargo-xwin --locked
      - run: cargo xwin build --release --target x86_64-pc-windows-msvc
      - run: cargo xwin build --release --target aarch64-pc-windows-msvc
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: x64 }
          - { os: windows-11-arm, name: arm64 }
    runs-on: ${{ matrix.os }}
    name: windows-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - run: cargo test --workspace
      - run: npm ci || npm install
        working-directory: app/ui
      - run: npm run build
        working-directory: app/ui
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml

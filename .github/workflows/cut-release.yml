name: Cut release
# Run from the Actions tab ("Run workflow"). Picks the next version, bumps it, commits, tags and
# pushes, then starts the Release workflow for the new tag. See docs/releasing.md.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'alpha (from main), beta or stable (promote a tested build)'
        required: true
        default: 'alpha'
        type: choice
        options: [alpha, beta, stable]
      from:
        description: 'Build to promote (beta/stable), for example v0.2.0-alpha.3. Empty = newest.'
        required: false
        default: ''
      base:
        description: 'Override the version number, for example 0.3.0. Empty = automatic.'
        required: false
        default: ''
permissions:
  contents: write
  actions: write
jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust toolchain
        run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - name: Cut
        env:
          KIND: ${{ inputs.kind }}
          FROM: ${{ inputs.from }}
          BASE: ${{ inputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          . "$HOME/.cargo/env"
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          [ "$KIND" = alpha ] && git checkout -q -B main origin/main
          args=()
          [ -n "$FROM" ] && args+=(--from "$FROM")
          [ -n "$BASE" ] && args+=(--base "$BASE")
          scripts/cut-release.sh "$KIND" "${args[@]}" --push
          # Pushes made with the built-in token do not start other workflows, so start Release by hand.
          tag="v$(git tag -l 'v*' --sort=-creatordate | head -1 | sed 's/^v//')"
          gh workflow run release.yml -f tag="$tag"

[package]
name = "sprknotes"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "SprkNotes app shell (Tauri v2)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sprk-pipeline = { path = "../../crates/sprk-pipeline" }
sprk-asr = { path = "../../crates/sprk-asr" }
sprk-audio = { path = "../../crates/sprk-audio", features = ["cpal-backend"] }
sprk-context = { path = "../../crates/sprk-context" }
sprk-models = { path = "../../crates/sprk-models" }
sprk-transcript = { path = "../../crates/sprk-transcript" }

[features]
# Speech engine (needs the sherpa-onnx native libs, SHERPA_ONNX_LIB_DIR). Without one of these
# the app still runs but Start reports that this build has no engine.
engine = ["sprk-asr/sherpa-static"]
engine-shared = ["sprk-asr/sherpa-shared"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

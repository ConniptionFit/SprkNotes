[package]
name = "sprknotes"
version = "0.2.0-alpha.1"
edition = "2021"
license = "MIT"
description = "SprkNotes app shell (Tauri v2)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
anyhow = "1"
# A second launch focuses the running window instead of starting another copy.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sprk-pipeline = { path = "../../crates/sprk-pipeline" }
sprk-assistant = { path = "../../crates/sprk-assistant" }
sprk-asr = { path = "../../crates/sprk-asr" }
sprk-audio = { path = "../../crates/sprk-audio", features = ["cpal-backend"] }
sprk-config = { path = "../../crates/sprk-config" }
sprk-context = { path = "../../crates/sprk-context" }
sprk-handoff = { path = "../../crates/sprk-handoff" }
sprk-models = { path = "../../crates/sprk-models" }
sprk-transcript = { path = "../../crates/sprk-transcript" }
sprk-update = { path = "../../crates/sprk-update" }

[features]
# Speech engine (needs the sherpa-onnx native libs, SHERPA_ONNX_LIB_DIR). Without one of these
# the app still runs but Start reports that this build has no engine.
engine = ["sprk-asr/sherpa-static"]
engine-shared = ["sprk-asr/sherpa-shared"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[target.'cfg(windows)'.dependencies]
# WinHTTP: the model download uses the system proxy and certificate store (ADR-005).
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_SystemInformation"] }

[target.'cfg(not(windows))'.dependencies]
# Model download off Windows: https only, system certificate store.
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }

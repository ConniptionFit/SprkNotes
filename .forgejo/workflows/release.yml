name: Release
# Runs when a release tag is pushed (scripts/cut-release.sh or the "Cut release" workflow does that).
# It checks the tag, re-runs the tests on exactly that commit, and creates a DRAFT release with
# notes. The Windows files are added to the draft from the Windows VM (docs/releasing.md), then the
# draft is published. Nothing becomes visible to the app's update check until it is published.
on:
  push:
    tags: ['v[0-9]*']
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust toolchain
        run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - name: Tag matches the code
        run: scripts/release-version.sh verify-tag "${{ github.ref_name }}"
      - name: Tag is on main or a release branch
        run: |
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          git branch -r --contains "${{ github.sha }}" | grep -E 'origin/(main|release/)' >/dev/null \
            || { echo "tag ${{ github.ref_name }} is not on main or a release/* branch"; exit 1; }
      - name: Promotion is the tested build plus a version bump
        run: scripts/release-version.sh guard "${{ github.ref_name }}"
      - run: . "$HOME/.cargo/env" && cargo test --workspace --locked
      - run: scripts/check-terms.sh
      - name: Create the draft release
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          scripts/release-notes.sh "${{ github.ref_name }}" > notes.md
          scripts/publish-release.sh draft "${{ github.ref_name }}" --notes notes.md

name: diag
on: [push]
jobs:
  j-checkout-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  j-has-git:
    runs-on: ubuntu-latest
    steps:
      - run: git --version
  j-has-cargo:
    runs-on: ubuntu-latest
    steps:
      - run: cargo --version
  j-has-rustup:
    runs-on: ubuntu-latest
    steps:
      - run: rustup --version
  j-has-node:
    runs-on: ubuntu-latest
    steps:
      - run: node --version
  j-has-cc:
    runs-on: ubuntu-latest
    steps:
      - run: cc --version
  j-net-crates:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sSfI https://index.crates.io/config.json
  j-net-github:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sSfI https://github.com
